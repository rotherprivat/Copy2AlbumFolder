name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Win-X64
        run: dotnet publish "Copy2AlbumFolder/Copy2AlbumFolder.csproj" -c Release -r win-x64 -p:IncludeSourceRevisionInInformationalVersion=false --output ./Publish/bin/win-x64

      - name: Pack
        working-directory: ./Publish
        run: zip -r Copy2AlbumFolder.zip bin/

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: Publish/Copy2AlbumFolder.zip